<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Website Assistant</title>
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --text: #1d2330; --muted: #5f6b7a;
    --accent: #1f5fbf; --accent-text: #ffffff; --bot: #eef2f7; --border: #dde2ea; --error: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --panel: #1b2029; --text: #e7ebf1; --muted: #9aa5b4;
      --accent: #5b9bff; --accent-text: #0b1220; --bot: #242b36; --border: #2e3644; --error: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .chat { max-width: 720px; margin: 0 auto; height: 100dvh; display: flex; flex-direction: column;
          background: var(--panel); border-inline: 1px solid var(--border); }
  header { padding: 14px 16px; border-bottom: 1px solid var(--border); }
  header h1 { margin: 0; font-size: 1.1rem; }
  header p { margin: 2px 0 0; color: var(--muted); font-size: .85rem; }
  #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 88%; padding: 10px 14px; border-radius: 14px; overflow-wrap: anywhere; }
  .user { align-self: flex-end; background: var(--accent); color: var(--accent-text); border-bottom-right-radius: 4px; }
  .bot { align-self: flex-start; background: var(--bot); border-bottom-left-radius: 4px; }
  .bot.error { color: var(--error); }
  .bot ul { margin: 6px 0; padding-left: 20px; }
  .bot p { margin: 0 0 6px; } .bot p:last-child { margin: 0; }
  .cite { font-size: .75em; vertical-align: super; text-decoration: none; color: var(--accent); }
  .sources { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); font-size: .85rem; }
  .sources ol { margin: 4px 0 0; padding-left: 20px; }
  .sources a { color: var(--accent); }
  .typing { color: var(--muted); font-style: italic; }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--border); }
  input { flex: 1; min-width: 0; padding: 10px 12px; font: inherit; color: var(--text);
          background: var(--bg); border: 1px solid var(--border); border-radius: 10px; }
  button { padding: 10px 16px; font: inherit; font-weight: 600; border: 0; border-radius: 10px;
           background: var(--accent); color: var(--accent-text); cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .note { padding: 0 16px 10px; color: var(--muted); font-size: .75rem; }
</style>
</head>
<body>
<main class="chat">
  <header>
    <h1>Ask our website assistant</h1>
    <p>Answers come only from pages on our website, with links so you can check.</p>
  </header>
  <div id="log" aria-live="polite">
    <div class="msg bot"><p>Hi! Ask me anything about our health insurance - for example, "How do I claim for dental?"</p></div>
  </div>
  <form id="form">
    <input id="q" maxlength="500" autocomplete="off" placeholder="Type your question..." aria-label="Your question" required>
    <button id="send">Send</button>
  </form>
  <div class="note">General information only - not personal advice. Please check details with us directly.</div>
</main>
<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("q");
const send = document.getElementById("send");

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

// Add text to `parent`, turning **bold** into <strong> and [n] into a link to source n.
// Everything goes through textContent, so nothing from the answer is treated as HTML.
function addInline(parent, text, sources) {
  for (const part of text.split(/(\*\*[^*]+\*\*|\[\d+\])/)) {
    if (!part) continue;
    const bold = part.match(/^\*\*([^*]+)\*\*$/);
    const cite = part.match(/^\[(\d+)\]$/);
    if (bold) parent.append(el("strong", "", bold[1]));
    else if (cite && sources[cite[1] - 1]) {
      const a = el("a", "cite", `[${cite[1]}]`);
      a.href = sources[cite[1] - 1].url; a.target = "_blank"; a.rel = "noopener";
      a.title = sources[cite[1] - 1].title;
      parent.append(a);
    } else parent.append(document.createTextNode(part));
  }
}

// Paragraphs and "- " bullet lists.
function renderAnswer(box, text, sources) {
  let list = null;
  for (const line of text.split("\n")) {
    const bullet = line.match(/^\s*[-*•]\s+(.*)/);
    if (bullet) {
      if (!list) { list = el("ul"); box.append(list); }
      const li = el("li"); addInline(li, bullet[1], sources); list.append(li);
    } else if (line.trim()) {
      list = null;
      const p = el("p"); addInline(p, line, sources); box.append(p);
    }
  }
  if (sources.length) {
    const s = el("div", "sources", "Sources:");
    const ol = el("ol");
    for (const src of sources) {
      const a = el("a", "", src.title || src.url);
      a.href = src.url; a.target = "_blank"; a.rel = "noopener";
      const li = el("li"); li.append(a); ol.append(li);
    }
    s.append(ol); box.append(s);
  }
}

function scroll() { log.scrollTop = log.scrollHeight; }

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const question = input.value.trim();
  if (!question) return;
  log.append(el("div", "msg user", question));
  input.value = ""; send.disabled = true;
  const box = el("div", "msg bot");
  box.append(el("span", "typing", "Looking that up..."));
  log.append(box); scroll();
  try {
    const res = await fetch("api/chat", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question }),
    });
    const data = await res.json().catch(() => ({}));
    box.textContent = "";
    if (!res.ok) { box.classList.add("error"); box.textContent = data.error || "Sorry, something went wrong."; }
    else renderAnswer(box, data.answer, data.sources || []);
  } catch {
    box.textContent = ""; box.classList.add("error");
    box.textContent = "Couldn't reach the chatbot - check your connection and try again.";
  }
  send.disabled = false; input.focus(); scroll();
});
</script>
</body>
</html>
